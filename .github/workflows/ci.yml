name: Kavach CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14-dev"
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest test suite
        run: |
          python -m pytest tests/ -v --junitxml=evidence/pytest_report.xml

      - name: Verify interactive demo
        run: |
          python demo.py --fast

  docker-isolation:
    name: Docker Network & Containment Isolation (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and start isolated 3-tier container topology
        run: |
          docker compose build
          docker compose up -d
          sleep 5

      - name: Verify interceptor is running and reachable from agent
        run: |
          docker compose exec -T agent python -c "
          import urllib.request
          req = urllib.request.Request('http://interceptor:8100/health')
          with urllib.request.urlopen(req, timeout=10) as resp:
              assert resp.status == 200, f'Interceptor health check failed: {resp.status}'
          print('✓ Agent -> Interceptor (:8100) reachable')
          "

      - name: Assert gateway is physically unreachable from agent container
        run: |
          docker compose exec -T agent python -c "
          import socket
          try:
              s = socket.socket()
              s.settimeout(2)
              res = s.connect_ex(('gateway', 8000))
              assert res != 0, 'SECURITY VIOLATION: Agent container established direct TCP connection to UPI Gateway!'
          except (socket.gaierror, OSError):
              # Expected: DNS resolution fails or connection is unreachable across isolated bridge networks
              pass
          print('✓ Physical network isolation enforced: Gateway is completely unreachable from Agent container.')
          "

      - name: Assert zero cryptographic keys in agent container
        run: |
          docker compose exec -T agent python -c "
          import os
          for k, v in os.environ.items():
              assert 'PRIVATE KEY' not in v, f'Found private key in agent env: {k}'
          print('✓ Process containment verified: Zero keys in agent environment.')
          "

      - name: Tear down topology
        if: always()
        run: docker compose down -v
